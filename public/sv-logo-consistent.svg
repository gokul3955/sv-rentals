<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="black" stroke="url(#goldGradient)" stroke-width="2"/>
  
  <!-- Decorative dots around the circle -->
  <circle cx="20" cy="25" r="1.5" fill="#FFD700"/>
  <circle cx="80" cy="30" r="1" fill="#FFD700"/>
  <circle cx="15" cy="60" r="1.2" fill="#FFD700"/>
  <circle cx="85" cy="70" r="1.8" fill="#FFD700"/>
  <circle cx="25" cy="85" r="1" fill="#FFD700"/>
  <circle cx="75" cy="15" r="1.3" fill="#FFD700"/>
  <circle cx="10" cy="40" r="1.1" fill="#FFD700"/>
  <circle cx="90" cy="50" r="1.4" fill="#FFD700"/>
  
  <!-- Decorative wavy lines -->
  <path d="M15 20 Q25 15 35 20 Q45 25 55 20" stroke="#FFD700" stroke-width="0.8" fill="none"/>
  <path d="M65 25 Q75 20 85 25" stroke="#FFD700" stroke-width="0.6" fill="none"/>
  
  <!-- SV Letters - BOTH in consistent serif font -->
  <text x="42" y="60" font-family="serif" font-size="26" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" font-style="normal">S</text>
  <text x="58" y="60" font-family="serif" font-size="26" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" font-style="normal">V</text>
  
  <!-- Decorative branch -->
  <path d="M65 45 Q70 40 75 45 Q70 50 65 45" stroke="#FFD700" stroke-width="1.5" fill="none"/>
  <circle cx="70" cy="42" r="1" fill="#FFD700"/>
  <circle cx="72" cy="48" r="0.8" fill="#FFD700"/>
</svg>
